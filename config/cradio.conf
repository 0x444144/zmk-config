CONFIG_ZMK_POINTING=y

# Key scan debounce. -1 (the default) defers to the devicetree properties,
# which are 5ms for both press and release.
#
# Light springs bounce more on release -- the finger leaves fast and the switch
# can re-make contact, which shows up as doubled letters. Raising only the
# release side guards against that without adding any press latency.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10
